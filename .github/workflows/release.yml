name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建与校验，不真正发布"
        type: boolean
        default: true

permissions:
  contents: read
  # npm provenance 需要 OIDC token：发布的包会附带可验证的来源证明，
  # 下游可以确认这个 tarball 确实由本仓库的这次 workflow 构建
  id-token: write

env:
  # 发布目标源由谁真正决定（按实际生效顺序，均已实测）：
  # 1) 仓库 .npmrc 不再设置 registry，runner 上也无用户级镜像，pnpm 因此用内置默认
  #    源 registry.npmjs.org；
  # 2) actions/setup-node 的 registry-url 会写 **user 级** .npmrc（pnpm 会读），
  #    同时写入 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} 供发布鉴权；
  # 3) 发布步骤的 --registry flag 作为显式声明。
  # 注意：作用域级 `@yanivjs:registry` 的优先级**高于**上述全部（含 CLI flag），
  # 因此 "Assert publish registry" 必须连它一起检查。
  #
  # NPM_CONFIG_REGISTRY 对 pnpm 无效（pnpm 11 不读该环境变量），仅覆盖 npm/npx 调用。
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  PUBLISH_REGISTRY: https://registry.npmjs.org/

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 发布前必须过完整门禁：npm 上的版本无法真正撤回（unpublish 有 72h 与依赖限制）
      - name: Verify
        run: pnpm run verify

      - name: Build
        run: pnpm run build

      # 与 CI 同一把尺子：真的 import()/require() 一遍每个入口，
      # 避免把 require 侧整个打穿的包发上 npm（npm 版本无法真正撤回）
      - name: Assert published entry points actually load
        run: node scripts/check-dist-entries.mjs

      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=${pkg} tag=${tag}"
          test "$pkg" = "$tag" || { echo "::error::tag 与 package.json 版本不一致"; exit 1; }

      - name: Assert LICENSE ships in the tarball
        # 上游为 MIT，许可证与版权声明必须随包分发（见 NOTICE）
        run: |
          set -euo pipefail
          pnpm pack --pack-destination /tmp >/dev/null
          tarball=$(ls /tmp/*.tgz | head -1)

          # 先把清单落到文件再匹配：`tar ... | grep -q` 会因 grep 命中后提前退出
          # 关闭管道，让 tar 收到 SIGPIPE，在 pipefail 下变成整条管道失败——
          # 即便文件确实存在也会误判为缺失
          tar -tzf "$tarball" > /tmp/tarball-entries.txt

          echo "tarball 内容:"; head -30 /tmp/tarball-entries.txt

          for required in package/LICENSE package/NOTICE; do
            grep -qxF "$required" /tmp/tarball-entries.txt || {
              echo "::error::发布包缺少 ${required#package/}"; exit 1; }
          done
          echo "✅ LICENSE 与 NOTICE 均随包分发"

      # 发布前确认目标源确实是官方 npm。
      #
      # 必须同时检查**作用域级** `@yanivjs:registry`：它的优先级高于通用 registry，
      # 也高于 `pnpm publish --registry` 这个 CLI flag——即真正决定 tarball 发到哪里的
      # 是它。只查 `pnpm config get registry` 会漏掉这层（本地实测：通用源是官方 npm、
      # 命令行也带了 --registry，publish 仍然解析到私有 Verdaccio）。
      - name: Assert publish registry
        run: |
          set -euo pipefail
          for key in registry @yanivjs:registry; do
            resolved=$(pnpm config get "$key")
            echo "${key} = ${resolved}"
            case "$resolved" in
              https://registry.npmjs.org*) ;;
              undefined|null|"") ;;   # 未设置作用域源时回落到通用源，符合预期
              *) echo "::error::${key} 解析为 ${resolved}，不是官方 npm"; exit 1 ;;
            esac
          done

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: pnpm publish --dry-run --no-git-checks --registry "$PUBLISH_REGISTRY"

      # workflow_dispatch 的分支/标签下拉框里**可以选中 tag**，此时 github.ref 同样是
      # refs/tags/v*。若只判断 ref，勾了"只构建不发布"的手动运行会连真发布一起执行——
      # 因此这里必须把手动触发排除在外，真发布只认 tag push。
      - name: Publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: pnpm publish --provenance --access public --no-git-checks --registry "$PUBLISH_REGISTRY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
