name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建与校验，不真正发布"
        type: boolean
        default: true

permissions:
  contents: read
  # npm provenance 需要 OIDC token：发布的包会附带可验证的来源证明，
  # 下游可以确认这个 tarball 确实由本仓库的这次 workflow 构建
  id-token: write

env:
  # 仓库 .npmrc 把 registry 指向 registry.npmmirror.com（只读镜像，无法发布）。
  # 三层保险，缺一不可：
  # 1) actions/setup-node 的 registry-url 只写 **user 级** 配置，优先级低于项目级 .npmrc；
  # 2) NPM_CONFIG_REGISTRY 环境变量在 pnpm 11 下也低于项目级 .npmrc（pnpm 10 时更高，
  #    升级后 "Assert publish registry" 曾因此解析成镜像而拦下发布）——故增加
  #    "Pin registry to official npm" 步骤直接改写 .npmrc；
  # 3) 发布步骤仍用 CLI flag 钉死目标源（CLI 优先级最高）。
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  PUBLISH_REGISTRY: https://registry.npmjs.org/

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7

      - name: Pin registry to official npm
        # 仓库 .npmrc 指向国内只读镜像。pnpm 11 起**项目级 .npmrc 的优先级高于
        # NPM_CONFIG_REGISTRY 环境变量**，仅靠 env 已经改不动，必须直接改写文件：
        # 否则 pnpm audit 会打到镜像上并不存在的 advisories 端点，
        # release 的 registry 断言也会解析成镜像而拦下发布。
        run: sed -i 's#^registry=.*#registry=https://registry.npmjs.org/#' .npmrc

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 发布前必须过完整门禁：npm 上的版本无法真正撤回（unpublish 有 72h 与依赖限制）
      - name: Verify
        run: pnpm run verify

      - name: Build
        run: pnpm run build

      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=${pkg} tag=${tag}"
          test "$pkg" = "$tag" || { echo "::error::tag 与 package.json 版本不一致"; exit 1; }

      - name: Assert LICENSE ships in the tarball
        # 上游为 MIT，许可证与版权声明必须随包分发（见 NOTICE）
        run: |
          set -euo pipefail
          pnpm pack --pack-destination /tmp >/dev/null
          tarball=$(ls /tmp/*.tgz | head -1)

          # 先把清单落到文件再匹配：`tar ... | grep -q` 会因 grep 命中后提前退出
          # 关闭管道，让 tar 收到 SIGPIPE，在 pipefail 下变成整条管道失败——
          # 即便文件确实存在也会误判为缺失
          tar -tzf "$tarball" > /tmp/tarball-entries.txt

          echo "tarball 内容:"; head -30 /tmp/tarball-entries.txt

          for required in package/LICENSE package/NOTICE; do
            grep -qxF "$required" /tmp/tarball-entries.txt || {
              echo "::error::发布包缺少 ${required#package/}"; exit 1; }
          done
          echo "✅ LICENSE 与 NOTICE 均随包分发"

      # 发布前确认目标源确实是官方 npm，而不是仓库 .npmrc 里的只读镜像
      - name: Assert publish registry
        run: |
          set -euo pipefail
          resolved=$(pnpm config get registry)
          echo "resolved registry: ${resolved}"
          case "$resolved" in
            https://registry.npmjs.org*) ;;
            *) echo "::error::registry 解析为 ${resolved}，不是官方 npm"; exit 1 ;;
          esac

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: pnpm publish --dry-run --no-git-checks --registry "$PUBLISH_REGISTRY"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm publish --provenance --access public --no-git-checks --registry "$PUBLISH_REGISTRY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
