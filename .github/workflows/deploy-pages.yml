name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pin registry to official npm
        # 仓库 .npmrc 指向国内只读镜像。pnpm 11 起**项目级 .npmrc 的优先级高于
        # NPM_CONFIG_REGISTRY 环境变量**，仅靠 env 已经改不动，必须直接改写文件。
        run: sed -i 's#^registry=.*#registry=https://registry.npmjs.org/#' .npmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 质量门禁前置：避免把类型/测试/lint 已经红掉的版本部署到线上文档站
      - name: Verify
        run: pnpm run verify

      - name: Build pages artifact
        run: pnpm pages:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
