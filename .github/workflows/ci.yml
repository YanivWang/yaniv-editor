name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 仓库 .npmrc 不再设置 registry（镜像属于开发者个人 ~/.npmrc），runner 上也没有用户级
  # 配置，因此 **pnpm 用的就是它内置的默认源 registry.npmjs.org**——这才是 CI 走官方源的
  # 真正原因，不需要任何额外步骤。
  #
  # 下面这个变量**对 pnpm 无效**（实测 pnpm 11 既不读 NPM_CONFIG_REGISTRY 也不读
  # npm_config_registry；npm 两个都读）。保留它只为覆盖流程里少数几处真正的 npm/npx
  # 调用，例如 preinstall 的 `npx only-allow pnpm`。不要依赖它来约束 pnpm 的行为。
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  quality:
    name: Typecheck / Test / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests (with coverage)
        run: pnpm run test:coverage

      - name: ESLint
        run: pnpm run lint

      - name: Stylelint
        run: pnpm run lint:style

      - name: Prettier
        run: pnpm run format:check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 两个在维护期的 LTS 都要能构建。
        # Node 20 已于 2026-04-30 EOL，不再收安全补丁，故从矩阵与 engines 中移除。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build

      # 逐条件真实加载 package.json#exports 的每个入口（import 用 import()，
      # require 用 require()），而不是只 `test -s` 看文件在不在。
      #
      # 旧断言只看文件非空，因此漏掉了两个把 CJS 侧整个打穿的问题：
      #   1) exports.require 指向 dist/index.js，而本包是 "type":"module"，
      #      Node 按 ESM 解析 → ReferenceError: exports is not defined
      #   2) rollup 默认 interop 取 module.exports 作默认导出，而 @tiptap/* 带
      #      __esModule 标记 → TypeError: X.configure is not a function
      # 两者在 ESM 侧都完全正常，只有真的 require 一次才会暴露。
      - name: Assert published entry points actually load
        run: node scripts/check-dist-entries.mjs

      - name: Assert type declarations are actually bundled
        # 加载自检已覆盖 d.ts 的存在性与后缀匹配；这里额外拦住"打包失效退化成转发空壳"：
        # vite-plugin-dts 5.x 把 rollupTypes 更名为 bundleTypes，旧名被静默忽略时
        # d.ts 会退化成 `export * from './src/index.js'` 这样 41 字节的空壳——
        # 指向发布包里并不存在的路径，下游拿不到任何类型。
        run: |
          set -euo pipefail
          for f in dist/index.d.ts dist/inline.d.ts dist/ai.d.ts \
                   dist/index.d.cts dist/inline.d.cts dist/ai.d.cts; do
            size=$(wc -c < "$f")
            echo "${f}: ${size}B"
            if grep -qE "^export \* from '\./src/" "$f"; then
              echo "::error::${f} 是未打包的转发空壳，检查 vite.config.ts 的 bundleTypes"
              exit 1
            fi
            if [ "$size" -lt 5000 ]; then
              echo "::error::${f} 仅 ${size}B，疑似类型打包失效"
              exit 1
            fi
          done

      - name: Assert inline.css stays lighter than style.css
        # inline 入口面向评论/表单等轻量场景；一旦它反超 style.css，
        # 说明 CSS 按入口拆分的逻辑又退化成了全量合并（见 vite.config.ts）
        run: |
          set -euo pipefail
          style=$(wc -c < dist/style.css)
          inline=$(wc -c < dist/inline.css)
          echo "style.css=${style}B inline.css=${inline}B"
          test "$inline" -lt "$style" || { echo "::error::inline.css 不应大于 style.css"; exit 1; }

      # 体积预算：给 5% 余量，超出必须显式调整预算并说明原因，
      # 避免"每次多一点"式的无声劣化
      - name: Enforce bundle size budget (gzip)
        run: |
          set -euo pipefail
          budget() {
            local file="$1" limit="$2" label="$3"
            local size
            size=$(gzip -c "$file" | wc -c | tr -d ' ')
            echo "${label}: ${size}B (预算 ${limit}B)"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::${label} gzip ${size}B 超出预算 ${limit}B"
              exit 1
            fi
          }
          budget "$(ls dist/EditorShell*.js | head -1)" 46000 "主 chunk (ESM)"
          budget dist/style.css                          19000 "style.css"
          budget dist/inline.css                         10500 "inline.css"

      - name: Assert gated capabilities are code-split out of the main chunk
        # preset/features 必须真正决定打包体积，而不只是运行时是否注册
        run: |
          set -euo pipefail
          chunk=$(ls dist/EditorShell*.js | head -1)
          echo "main chunk: $chunk"
          for marker in 'new PluginKey("dragHandle")' 'new PluginKey("slashCommand")' \
                        'yanivSearchReplace' 'chat/completions'; do
            if grep -qF "$marker" "$chunk"; then
              echo "::error::门控能力未拆分，主 chunk 中发现: $marker"
              exit 1
            fi
          done

      - name: Upload dist
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 阻断门禁：只看本包实际分发的依赖。
      # 本包 dependencies 为空（全部走 peer/dev），因此这一层等价于「发布物不携带已知漏洞」。
      - name: Audit production dependencies (blocking)
        run: pnpm audit --audit-level high --prod

      # 可见性：工具链（devDependencies）的传世漏洞多数要等上游发版才能修，
      # 不该让每个 PR 因为 commitlint→ajv→fast-uri 这类链路变红；但必须持续可见。
      - name: Audit full dependency tree (informational)
        continue-on-error: true
        run: pnpm audit --audit-level high
